name: Hourly deadline check

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Call /check-deadlines
        run: |
          curl -sS -X POST "${{ secrets.RENDER_URL }}/check-deadlines" \
            -H "X-Cron-Secret: ${{ secrets.CRON_SECRET }}" \
            --max-time 60 \
            --retry 2
